name: CampusCare CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Production Web Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://uxujdjyuhduthyhkcqfa.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_hZiNDCOhBDMm1EnjAC61dQ_3ek8W6Y8"
