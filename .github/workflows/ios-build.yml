name: Build Native iOS App (Sideloadly IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to iOS (manual sync)
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json 2>/dev/null || true
          echo "✅ Web assets copied: $(ls ios/App/App/public/ | wc -l) items"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache"

      - name: Build iOS App (ad-hoc signed)
        run: |
          mkdir -p "${{ github.workspace }}/build"
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tail -30
          echo "✅ xcodebuild finished (exit $?)"

      - name: Find and verify .app bundle
        run: |
          echo "=== Searching for .app bundles ==="
          find "${{ github.workspace }}/build/DerivedData" -name "*.app" 2>/dev/null || echo "No .app found"
          echo "=== Products directories ==="
          find "${{ github.workspace }}/build/DerivedData/Build/Products" -maxdepth 2 -type d 2>/dev/null || echo "No Products dir"

      - name: Package Payload into Sideloadly-Ready IPA
        run: |
          # Search broadly across all Products subdirectories
          APP_PATH=$(find "${{ github.workspace }}/build/DerivedData/Build/Products" \
            -name "*.app" -not -name "*.app.dSYM" 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found anywhere"
            exit 1
          fi

          echo "✅ Found: $APP_PATH"

          # If Info.plist is missing, copy from source
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "⚠️ Info.plist missing - copying from source"
            cp ios/App/App/Info.plist "$APP_PATH/Info.plist"
          fi
          echo "✅ Info.plist: $(plutil -p "$APP_PATH/Info.plist" | grep CFBundleIdentifier || echo 'present')"

          # Package into IPA
          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -r "$APP_PATH" "${{ github.workspace }}/build/Payload/"
          cd "${{ github.workspace }}/build"
          zip -qr CampusCare.ipa Payload
          echo "✅ IPA ready: $(du -sh CampusCare.ipa)"

      - name: Upload CampusCare Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-IPA
          path: build/CampusCare.ipa
          if-no-files-found: error
