name: Build Native iOS App (Sideloadly IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to iOS (manual sync)
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json 2>/dev/null || true
          echo "✅ Web assets copied"

      - name: Set up self-signed code signing identity
        run: |
          # Create a temporary self-signed certificate for code signing
          # This allows xcodebuild to fully process Info.plist and produce a complete .app
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # Generate a self-signed certificate
          cat > /tmp/cert.conf << 'EOF'
          [req]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_req
          prompt = no
          [req_distinguished_name]
          CN = CampusCare Development
          [v3_req]
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          EOF

          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem \
            -out /tmp/cert.pem -days 1 -nodes \
            -subj "/CN=iPhone Developer/O=CampusCare/C=US" 2>/dev/null

          openssl pkcs12 -export -out /tmp/dev.p12 \
            -inkey /tmp/key.pem -in /tmp/cert.pem \
            -passout pass:campuscare 2>/dev/null

          security import /tmp/dev.p12 -k build.keychain \
            -P campuscare -T /usr/bin/codesign 2>/dev/null

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain 2>/dev/null || true

          # Get the identity name
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "iPhone Developer" | head -1 | awk '{print $3}' | tr -d '"')
          echo "Code signing identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache"

      - name: Build iOS App (self-signed for complete .app bundle)
        run: |
          mkdir -p "${{ github.workspace }}/build"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            "CODE_SIGN_IDENTITY=$SIGN_IDENTITY" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            COMPILER_INDEX_STORE_ENABLE=NO
          echo "✅ Build succeeded"

      - name: Package Payload into Sideloadly-Ready IPA
        run: |
          APP_PATH=$(find "${{ github.workspace }}/build/DerivedData/Build/Products" \
            -name "*.app" -not -name "*.dSYM" 2>/dev/null | head -1)

          echo "App path: $APP_PATH"
          ls "$APP_PATH/" || true

          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -r "$APP_PATH" "${{ github.workspace }}/build/Payload/"
          cd "${{ github.workspace }}/build"
          zip -qr CampusCare.ipa Payload
          echo "✅ IPA ready: $(du -sh CampusCare.ipa)"

      - name: Upload CampusCare Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-IPA
          path: build/CampusCare.ipa
          if-no-files-found: error
