name: Build Native iOS App (Sideloadly IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Prepare iOS Project & Web Assets
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json
          
          # Ensure config.xml exists
          if [ ! -f ios/App/App/config.xml ]; then
            cat << 'EOF' > ios/App/App/config.xml
<?xml version='1.0' encoding='utf-8'?>
<widget version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
  <access origin="*" />
</widget>
EOF
          fi
          echo "✅ iOS assets and configs verified"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache"

      - name: Build iOS App (unsigned)
        run: |
          mkdir -p "${{ github.workspace }}/build"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO
          echo "✅ Xcode build succeeded"

      - name: Package Payload into Sideloadly-Ready IPA
        run: |
          # Locate built .app bundle
          APP_PATH=$(find "${{ github.workspace }}/build/DerivedData/Build/Products" \
            -name "*.app" -not -name "*.dSYM" 2>/dev/null | grep -v dSYM | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found. Listing DerivedData:"
            find "${{ github.workspace }}/build/DerivedData" -maxdepth 5 2>/dev/null | head -30
            exit 1
          fi
          echo "✅ Found built app: $APP_PATH"

          # Inject resolved Info.plist with MinimumOSVersion 15.0 and bundle details
          cp ios/App/App/Info.resolved.plist "$APP_PATH/Info.plist"
          echo "✅ Injected Info.plist:"
          plutil -p "$APP_PATH/Info.plist"

          # Prepare Payload structure required by Sideloadly & iOS
          rm -rf "${{ github.workspace }}/build/Payload"
          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -R "$APP_PATH" "${{ github.workspace }}/build/Payload/"

          cd "${{ github.workspace }}/build"
          zip -qry CampusCare.ipa Payload

          echo "✅ IPA archive created successfully:"
          du -sh CampusCare.ipa
          
          echo "🔍 Verifying archive structure for Sideloadly:"
          unzip -l CampusCare.ipa | grep -E "Payload/App.app/(Info.plist|App)"

      - name: Upload CampusCare Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-IPA
          path: build/CampusCare.ipa
          if-no-files-found: error
