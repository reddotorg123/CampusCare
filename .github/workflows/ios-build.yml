name: Build Native iOS App (Sideloadly IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to iOS (manual sync)
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json 2>/dev/null || true
          echo "✅ Web assets copied: $(ls ios/App/App/public/ | wc -l) items"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache"

      - name: Build iOS App (ad-hoc signed for complete Info.plist)
        run: |
          mkdir -p "${{ github.workspace }}/build"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | grep -E "error:|BUILD|✅|Compiling" || true
          echo "✅ Build step done"

      - name: Package Payload into Sideloadly-Ready IPA
        run: |
          # Find the .app in the Release-iphoneos products folder
          APP_PATH=$(find "${{ github.workspace }}/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found. Full DerivedData contents:"
            find "${{ github.workspace }}/build/DerivedData" -name "*.app" 2>/dev/null || echo "None"
            exit 1
          fi

          echo "✅ Found: $APP_PATH"

          # Verify Info.plist exists
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Info.plist missing! Contents of .app:"
            ls -la "$APP_PATH/"
            exit 1
          fi
          echo "✅ Info.plist verified"

          # Package into IPA
          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -r "$APP_PATH" "${{ github.workspace }}/build/Payload/"
          cd "${{ github.workspace }}/build"
          zip -qr CampusCare.ipa Payload
          echo "✅ IPA ready: $(du -sh CampusCare.ipa)"

      - name: Upload CampusCare Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-IPA
          path: build/CampusCare.ipa
          if-no-files-found: error
