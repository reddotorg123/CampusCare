name: Build Native iOS App (Sideloadly IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to iOS (manual sync)
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json 2>/dev/null || true
          echo "✅ Web assets copied: $(ls ios/App/App/public/ | wc -l) items"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache"

      - name: Build iOS App (unsigned, for IPA packaging)
        run: |
          mkdir -p "${{ github.workspace }}/build"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm-cache" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee /tmp/xcodebuild.log | grep -E "error:|warning:|BUILD|Compiling|Linking" || true

      - name: Verify Build Output
        run: |
          APP_PATH=$(find "${{ github.workspace }}/build/DerivedData" -name "*.app" -path "*/Products/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found. Build output:"
            cat /tmp/xcodebuild.log | tail -50
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package Payload into Sideloadly-Ready IPA
        run: |
          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -r "$APP_PATH" "${{ github.workspace }}/build/Payload/"
          cd "${{ github.workspace }}/build"
          zip -r CampusCare.ipa Payload
          echo "✅ IPA ready: $(du -sh CampusCare.ipa)"

      - name: Upload CampusCare Sideloadly IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-IPA
          path: build/CampusCare.ipa
          if-no-files-found: error
