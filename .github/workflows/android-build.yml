name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://uxujdjyuhduthyhkcqfa.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_hZiNDCOhBDMm1EnjAC61dQ_3ek8W6Y8"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Stage APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/CampusCare.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCare-Android-APK
          path: output-apk/CampusCare.apk
          if-no-files-found: error
